; ESP32-WROOM-32E OBD-II Bluetooth OLED gauge cluster
; https://docs.platformio.org/page/projectconf.html
;
; Two build targets:
;   pio run -e bringup  -t upload   raw Bluetooth/OBD terminal (setup + debugging)
;   pio run -e esp32dev -t upload   the actual gauge firmware

; Bring-up is done (see HARDWARE.md), so the gauge firmware is the
; default. Use `-e bringup` for the raw terminal / browser console.
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ELMduino was dropped: this adapter emits ISO 9141-2 headers even
; after ATH0, so replies are parsed directly in obd_manager.cpp. See
; HARDWARE.md.
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
    adafruit/Adafruit SH110X@^2.1.11
    adafruit/Adafruit SSD1306@^2.5.9

; Gauge firmware: everything except the bring-up tool.
[env:esp32dev]
build_src_filter = +<*> -<bringup.cpp>

; Bring-up tool: standalone, no display or ELMduino involved, so a
; failure here points at the Bluetooth/OBD link and nothing else.
[env:bringup]
build_src_filter = +<bringup.cpp>
monitor_echo = yes
